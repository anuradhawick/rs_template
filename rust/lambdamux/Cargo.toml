[package]
name = "lambdamux"
version = "1.0.3"
edition = "2021"
description = "AWS Lambda HTTP routing with attribute macros and API Gateway adapters"
license = "GPL-3.0-only OR Apache-2.0"
repository = "https://github.com/anuradhawick/rs_template"
readme = "README.md"
keywords = ["aws", "lambda", "router", "apigateway", "macro"]
categories = ["web-programming", "api-bindings"]

[dependencies]
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["apigw"] }
lambda_runtime = "1.3.0"
lambdamux_core = { package = "lambdamux-core", version = "1.0.3", path = "../lambdamux-core" }
lambdamux_macro = { package = "lambdamux-macro", version = "1.0.3", path = "../lambdamux-macro" }
